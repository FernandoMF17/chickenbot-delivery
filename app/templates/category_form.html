{% extends "base.html" %}

{% block content %}

<h2>{{ title }}</h2>

<form method="POST">

    <label>Nombre</label>

    <br>

    <input
        type="text"
        name="name"
        value="{{ category.name if category else '' }}"
        required
    >

    <br><br>

    <button type="submit">
        Guardar
    </button>

</form>

<br>

<a href="/categories">
    Volver
</a>

{% endblock %}
