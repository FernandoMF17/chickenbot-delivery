{% extends "base.html" %}

{% block content %}

<h2>{{ title }}</h2>

<form method="POST">

    <label>Nombre</label><br>

    <input
        type="text"
        name="name"
        value="{{ product.name if product else '' }}"
        required
    >

    <br><br>

    <label>Descripción</label><br>
 
    <textarea
        name="description"
        rows="4"
        cols="40"
    >{{ product.description if product else '' }}</textarea>

    <br><br>

    <label>Precio</label><br>

    <input
        type="number"
        step="0.01"
        name="price"
        value="{{ product.price if product else '' }}"
        required
    >

    <br><br>

    <label>Stock</label><br>

    <input
        type="number"
        name="stock"
        value="{{ product.stock if product else '' }}"
        required
    >

    <br><br>

    <label>Categoría</label><br>

    <select
        name="category_id"
        required
    >

        {% for category in categories %}

            <option
                value="{{ category.id }}"
                {% if product and product.category_id == category.id %}
                    selected
                {% endif %}
            >
                {{ category.name }}
            </option>

        {% endfor %}

    </select>

    <br><br>

    <button type="submit">
        Guardar
    </button>

</form>

<br>

<a href="/dashboard">
    Volver
</a>

{% endblock %}
